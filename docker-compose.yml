# Caps every container's stdout/stderr log growth - Docker's default json-file
# driver has no size limit otherwise, so logs can grow unbounded over a long
# uptime. Applied to every service below via "logging: *default-logging".
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  homelab_net:
    driver: bridge

services:
  # --- qBittorrent, Prowlarr, and Byparr each have two mutually-exclusive variants,
  # toggled together via COMPOSE_PROFILES in .env: "novpn" runs them directly on
  # homelab_net; "vpn" routes all three through Gluetun's tunnel instead (their "-vpn"
  # service below, sharing gluetun's network namespace) - useful when an indexer is
  # blocked at the ISP/network level rather than by a Cloudflare-style challenge, which
  # Byparr alone can't get around. Each pair keeps the same container_name (Docker allows
  # this since the profiles are mutually exclusive - only one of a pair ever runs), so
  # nothing downstream (Caddy, Sonarr, Radarr, this repo's own setup.sh) needs to change
  # when you switch modes: qBittorrent is reached via its published host port either way,
  # while Prowlarr/Byparr are reached by the container names "prowlarr"/"byparr" both as
  # a `docker exec` target (setup.sh) and as a network alias gluetun advertises in vpn
  # mode (Caddy, Sonarr, Radarr, Bazarr).

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls474
    container_name: qbittorrent
    profiles: ["novpn"]
    networks:
      - homelab_net
    ports:
      - "8080:8080"       # WebUI
      - "6881:6881"        # torrent TCP
      - "6881:6881/udp"    # torrent UDP
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - /opt/media-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gluetun:
    # Gluetun publishes no version tag matching its "latest" builds (its own
    # startup log literally reports "Running version latest"), so pinning by
    # tag would risk silently pinning to an older release than what's
    # actually been running and tested here - pinned by digest instead,
    # which is guaranteed to match exactly.
    image: qmcgaw/gluetun@sha256:89e3cbe22e0d6f09a18d3e86269392fd9f7f08e8991040741e577f8f127cdfe4
    container_name: gluetun
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      homelab_net:
        aliases:
          # So downstream services always resolve these names regardless of mode -
          # see the mutually-exclusive-variants comment above services: for why.
          - qbittorrent
          - prowlarr
          - byparr
    ports:
      - "8080:8080"      # qBittorrent WebUI (published here — qbittorrent-vpn has no netns of its own)
      - "6881:6881"       # torrent TCP
      - "6881:6881/udp"   # torrent UDP
    environment:
      # Provider-agnostic: these are Gluetun's own variable names, not tied to any one
      # VPN service. Set VPN_SERVICE_PROVIDER/VPN_TYPE plus whichever credential and
      # location variables your provider needs (see .env.example for PIA/ProtonVPN/
      # Mullvad examples, or https://github.com/qdm12/gluetun-wiki for any other
      # provider Gluetun supports - the exact variables required vary by provider).
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-private internet access}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - OPENVPN_USER=${VPN_USER:-}
      - OPENVPN_PASSWORD=${VPN_PASSWORD:-}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY:-}
      - SERVER_COUNTRIES=${VPN_COUNTRIES:-}
      - SERVER_REGIONS=${VPN_REGIONS:-}
      - SERVER_CITIES=${VPN_CITIES:-}
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET}
      # WebUI/API ports for qBittorrent, Prowlarr, and Byparr - Gluetun firewalls
      # inbound connections by default, so anything sharing its network namespace
      # needs its port listed here to stay reachable from other containers.
      - FIREWALL_INPUT_PORTS=8080,9696,8191
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-off}
      # Keeps qBittorrent listening on whatever port the VPN provider just
      # forwarded (it can rotate over time) - see the hook script for how.
      - VPN_PORT_FORWARDING_UP_COMMAND=sh /gluetun-port-forward-hook.sh {{PORTS}}
      - TZ=${TZ}
    volumes:
      - ./config/gluetun:/gluetun
      - ./scripts/gluetun-port-forward-hook.sh:/gluetun-port-forward-hook.sh:ro
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qbittorrent-vpn:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls474
    container_name: qbittorrent-vpn
    profiles: ["vpn"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - /opt/media-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls158
    container_name: prowlarr
    profiles: ["novpn"]
    networks:
      - homelab_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prowlarr-vpn:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls158
    container_name: prowlarr
    profiles: ["vpn"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  byparr:
    # Solves Cloudflare/anti-bot challenges on behalf of Prowlarr for
    # indexers that would otherwise return a challenge page instead of
    # results. Drop-in replacement for the now-non-functional FlareSolverr -
    # same /v1 request API and default port (8191), so Prowlarr's built-in
    # "FlareSolverr" proxy type just needs pointing at this container.
    # No semver tags are published - pinned to the exact commit-sha tag
    # matching the image currently running (its own version label), which
    # is the most precise reference available for this project.
    image: ghcr.io/thephaseless/byparr:cb2a862386e92f141e8aa3b58f8532ef2fc36ed0-amd64
    container_name: byparr
    profiles: ["novpn"]
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 15s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  byparr-vpn:
    image: ghcr.io/thephaseless/byparr:cb2a862386e92f141e8aa3b58f8532ef2fc36ed0-amd64
    container_name: byparr
    profiles: ["vpn"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 15s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls322
    container_name: sonarr
    networks:
      - homelab_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - /opt/media-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls314
    container_name: radarr
    networks:
      - homelab_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - /opt/media-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  recyclarr:
    # Keeps Sonarr/Radarr quality profiles and custom formats in sync with
    # the community-maintained TRaSH Guides, on its own built-in cron
    # schedule (CRON_SCHEDULE below) - no web UI, nothing to reverse-proxy.
    # Runs as a fixed non-root user (UID 1000) baked into the image; its
    # entrypoint already uses tini, so no init:true needed.
    # No ":latest" tag is published for this image - only semver tags and
    # "edge" (built from the unstable master branch). Pin to the major
    # version instead, matching Recyclarr's own documented convention.
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    networks:
      - homelab_net
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=@daily
    volumes:
      - ./config/recyclarr:/config
    healthcheck:
      test: ["CMD", "pgrep", "-f", "supercronic"]
      interval: 5m
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.0-ls362
    container_name: bazarr
    networks:
      - homelab_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/bazarr:/config
      - /opt/media-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    user: "1000:1000"
    networks:
      - homelab_net
    ports:
      - "8096:8096"   # published directly too — native Jellyfin apps prefer direct discovery
    volumes:
      - ./config/jellyfin:/config
      - /opt/media-data/media:/data/media:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  seerr:
    # Seerr is the merged successor to Overseerr/Jellyseerr (both are EOL as
    # of 2026) - runs as a fixed non-root "node" user (UID 1000) baked into
    # the image, so no PUID/PGID env vars, and needs init:true since it no
    # longer bundles its own init process.
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    init: true
    networks:
      - homelab_net
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/seerr:/app/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  homepage:
    # Self-hosted dashboard with live widgets for every service in this
    # stack, generated once from this stack's own ports/API keys
    # (config/homepage/services.yaml) - edit that file by hand afterward to
    # rearrange things; setup.sh won't overwrite it once it exists. No
    # Docker socket is mounted for auto-discovery, to avoid docker.sock as
    # an attack surface - static config covers the whole stack instead.
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage
    networks:
      - homelab_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=admin.media.lan
    volumes:
      - ./config/homepage:/app/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4
    container_name: caddy
    networks:
      - homelab_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv/landing:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config
    healthcheck:
      # Only checks Caddy's own HTTP listener answers - deliberately not one
      # of the proxied *.media.lan sites, so Caddy's health doesn't depend on
      # any backend service being up. The 308 redirect to HTTPS (no cert for
      # bare "localhost") is the expected healthy response; curl -f only
      # fails on 4xx/5xx, so it passes without needing to follow it.
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
